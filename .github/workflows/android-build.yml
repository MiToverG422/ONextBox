name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: true
        default: "ci"
        type: choice
        options:
          - ci
          - release
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
    outputs:
      version_name:
        value: ${{ jobs.build.outputs.version_name }}
      version_code:
        value: ${{ jobs.build.outputs.version_code }}

permissions:
  contents: write

concurrency:
  group: onextbox-${{ github.ref_type == 'tag' && github.ref || inputs.channel || 'ci' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: telegram_bot
    outputs:
      version_name: ${{ steps.apks.outputs.version_name }}
      version_code: ${{ steps.apks.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve build channel
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          channel="${INPUT_CHANNEL:-ci}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            channel=release
          fi
          echo "name=$channel" >> "$GITHUB_OUTPUT"

      - name: Prepare signing config
        id: signing
        shell: bash
        env:
          BUILD_CHANNEL: ${{ steps.channel.outputs.name }}
          ONEXTBOX_RELEASE_KEYSTORE_B64: ${{ secrets.ONEXTBOX_RELEASE_KEYSTORE_B64 }}
          ONEXTBOX_RELEASE_STORE_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_STORE_PASSWORD }}
          ONEXTBOX_RELEASE_KEY_ALIAS: ${{ secrets.ONEXTBOX_RELEASE_KEY_ALIAS }}
          ONEXTBOX_RELEASE_KEY_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          HAS_RELEASE_SIGNING=false
          KEYSTORE_PATH=""

          if [[ -n "${ONEXTBOX_RELEASE_KEYSTORE_B64}" && -n "${ONEXTBOX_RELEASE_STORE_PASSWORD}" && -n "${ONEXTBOX_RELEASE_KEY_ALIAS}" && -n "${ONEXTBOX_RELEASE_KEY_PASSWORD}" ]]; then
            mkdir -p .ci-signing
            KEYSTORE_PATH="${GITHUB_WORKSPACE}/.ci-signing/release.jks"
            umask 077
            printf '%s' "${ONEXTBOX_RELEASE_KEYSTORE_B64}" | base64 -d > "${KEYSTORE_PATH}"
            if ! keytool -list -keystore "${KEYSTORE_PATH}" -storepass:env ONEXTBOX_RELEASE_STORE_PASSWORD -alias "${ONEXTBOX_RELEASE_KEY_ALIAS}" >/dev/null 2>&1; then
              echo "::error::Signing keystore, store password or key alias is invalid. No certificate will be replaced."
              exit 1
            fi
            HAS_RELEASE_SIGNING=true
            echo "Release signing keystore prepared"
          else
            if [[ "${BUILD_CHANNEL}" == "ci" ]]; then
              echo "::warning::Release signing secrets are incomplete. CI will use debug signing for this test build."
            else
              echo "::error::Release signing secrets are incomplete. Release builds must use one unified signing certificate."
              exit 1
            fi
          fi

          echo "has_release_signing=${HAS_RELEASE_SIGNING}" >> "${GITHUB_OUTPUT}"
          echo "keystore_path=${KEYSTORE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Validate and build APKs
        shell: bash
        env:
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_STORE_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_KEY_ALIAS: ${{ secrets.ONEXTBOX_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_KEY_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.has_release_signing }}" != "true" ] && [ "${{ steps.channel.outputs.name }}" != "ci" ]; then
            echo "::error::Release signing is required for release channel."
            exit 1
          fi

          SIGN_RELEASE_WITH_DEBUG=false
          if [ "${{ steps.signing.outputs.has_release_signing }}" != "true" ]; then
            SIGN_RELEASE_WITH_DEBUG=true
          fi

          GRADLE_ARGS=(
            "-PONEXTBOX_BUILD_CHANNEL=${{ steps.channel.outputs.name }}"
            "-PONEXTBOX_BUILD_TIMESTAMP=$(date +%s000)"
            "-PONEXTBOX_CI_SIGN_RELEASE_WITH_DEBUG=${SIGN_RELEASE_WITH_DEBUG}"
          )

          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease "${GRADLE_ARGS[@]}" --max-workers=1 --no-daemon --console=plain

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${GITHUB_WORKSPACE}/.ci-signing/release.jks"

      - name: Read APK versions and prepare files
        id: apks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          entries = {}
          for variant in ("debug", "release"):
              directory = Path("app/build/outputs/apk") / variant
              entry, = json.loads((directory / "output-metadata.json").read_text())["elements"]
              entries[variant] = entry
          version = entries["release"]["versionName"]
          code = entries["release"]["versionCode"]
          debug = entries["debug"]
          if (debug["versionName"], debug["versionCode"]) != (version, code):
              raise SystemExit("Debug and Release APK version metadata differ.")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"][1:] != version:
              raise SystemExit(f"Expected tag V{version} for this commit.")
          for variant, entry in entries.items():
              source = Path("app/build/outputs/apk") / variant / entry["outputFile"]
              shutil.copy2(source, dist / f"onextbox-{version}-EX01-{variant}.apk")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version_name={version}", f"version_code={code}", sep="\n", file=output)
          PY

      - name: Verify APK signatures and checksums
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "${SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          for apk in dist/*.apk; do
            "${APKSIGNER}" verify "${apk}"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS)

      - name: Upload Release APK
        id: release_apk
        uses: actions/upload-artifact@v7
        with:
          path: dist/onextbox-${{ steps.apks.outputs.version_name }}-EX01-release.apk
          archive: false
          if-no-files-found: error

      - name: Upload Debug APK
        id: debug_apk
        uses: actions/upload-artifact@v7
        with:
          path: dist/onextbox-${{ steps.apks.outputs.version_name }}-EX01-debug.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK checksums
        uses: actions/upload-artifact@v7
        with:
          path: dist/SHA256SUMS
          archive: false
          if-no-files-found: error

      - name: Publish signed CI APKs for in-app updates
        if: ${{ github.repository == 'MiToverG422/ONextBox' && github.ref == 'refs/heads/main' && steps.channel.outputs.name == 'ci' && steps.signing.outputs.has_release_signing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.apks.outputs.version_name }}
          VERSION_CODE: ${{ steps.apks.outputs.version_code }}
        run: |
          set -euo pipefail
          tag=ci-latest
          title="ONextBox $VERSION_NAME"
          notes="$(printf 'CI build from %s.\n\n<!-- onextbox-version-code: %s -->\n' "$GITHUB_SHA" "$VERSION_CODE")"
          if existing=$(gh release view "$tag" --json body --jq .body 2>/dev/null); then
            current_code=$(sed -n 's/^<!-- onextbox-version-code: \([0-9][0-9]*\) -->$/\1/p' <<<"$existing" | head -n 1)
            if [[ -n "$current_code" ]] && (( current_code > VERSION_CODE )); then
              echo "ci-latest already points to a newer build."
              exit 0
            fi
            gh release upload "$tag" dist/*.apk --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --prerelease --latest=false
            while IFS= read -r asset; do
              if [[ "$asset" =~ ^onextbox-[0-9.]+-CI-[0-9a-fA-F]+-EX01-(debug|release)\.apk$ && ! -f "dist/$asset" ]]; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          else
            gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "$title" --notes "$notes" --prerelease --latest=false
          fi

      - name: Send APKs to Telegram
        if: ${{ !cancelled() && steps.release_apk.outcome == 'success' && steps.debug_apk.outcome == 'success' && github.ref_type != 'tag' && github.repository == 'MiToverG422/ONextBox' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_CI_CHAT_ID: ${{ secrets.TELEGRAM_CI_CHAT_ID }}
          TG_RELEASE_CHAT_ID: ${{ secrets.TELEGRAM_RELEASE_CHAT_ID }}
          TG_CI_THREAD_ID: ${{ secrets.TELEGRAM_CI_THREAD_ID }}
          TG_RELEASE_THREAD_ID: ${{ secrets.TELEGRAM_RELEASE_THREAD_ID }}
          BUILD_CHANNEL: ${{ steps.channel.outputs.name }}
          VERSION_NAME: ${{ steps.apks.outputs.version_name }}
          VERSION_CODE: ${{ steps.apks.outputs.version_code }}
        run: bash .github/scripts/send-telegram-apks.sh
