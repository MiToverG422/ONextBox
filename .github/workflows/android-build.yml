name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Build channel"
        required: true
        default: "ci"
        type: choice
        options:
          - ci
          - release
      version_name:
        description: "Optional base version name override"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: telegram_bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve channel and version
        id: version
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          set -euo pipefail

          DEFAULT_BASE_VERSION="17.0"
          VERSION_CODE="1"
          VERSION_CODE_LABEL="EX01"
          CI_CODE="${GITHUB_SHA:0:8}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            CHANNEL="${INPUT_CHANNEL:-ci}"

            if [[ -n "${INPUT_VERSION}" && ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([._-][A-Za-z0-9]+)*$ ]]; then
              echo "::error::Version must start with X.Y or X.Y.Z and contain only a safe alphanumeric suffix."
              exit 1
            fi

            if [[ -z "${CHANNEL}" ]]; then
              CHANNEL="ci"
            fi

            case "${CHANNEL}" in
              ci)
                CI_BASE_VERSION="${INPUT_VERSION:-${DEFAULT_BASE_VERSION}}"
                VERSION_NAME="${CI_BASE_VERSION}-CI-${CI_CODE}"
                BUILD_VARIANT="both"
                ;;
              release)
                VERSION_NAME="${INPUT_VERSION:-${DEFAULT_BASE_VERSION}}"
                BUILD_VARIANT="both"
                ;;
              *)
                echo "Unsupported manual channel: ${CHANNEL}"
                exit 1
                ;;
            esac
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"

            if [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
              CHANNEL="release"
              VERSION_NAME="${BASH_REMATCH[1]}"
              BUILD_VARIANT="both"
            else
              echo "Unsupported tag format: ${TAG}"
              echo "Use vX.Y or vX.Y.Z"
              exit 1
            fi
          else
            CHANNEL="ci"
            VERSION_NAME="${DEFAULT_BASE_VERSION}-CI-${CI_CODE}"
            BUILD_VARIANT="both"
          fi

          if [[ "${BUILD_VARIANT}" == "both" ]]; then
            APK_PATH_GLOB="app/build/outputs/apk/debug/*.apk,app/build/outputs/apk/release/*.apk"
          elif [[ "${BUILD_VARIANT}" == "debug" ]]; then
            APK_PATH_GLOB="app/build/outputs/apk/debug/*.apk"
          else
            APK_PATH_GLOB="app/build/outputs/apk/release/*.apk"
          fi

          echo "channel=${CHANNEL}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "version_code_label=${VERSION_CODE_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "ci_code=${CI_CODE}" >> "${GITHUB_OUTPUT}"
          echo "build_variant=${BUILD_VARIANT}" >> "${GITHUB_OUTPUT}"
          echo "apk_path_glob=${APK_PATH_GLOB}" >> "${GITHUB_OUTPUT}"

          echo "Resolved channel=${CHANNEL}"
          echo "Resolved version_name=${VERSION_NAME}"
          echo "Resolved version_code=${VERSION_CODE}"
          echo "Resolved version_code_label=${VERSION_CODE_LABEL}"
          echo "Resolved ci_code=${CI_CODE}"
          echo "Resolved build_variant=${BUILD_VARIANT}"
          echo "Resolved apk_path_glob=${APK_PATH_GLOB}"

      - name: Prepare signing config
        id: signing
        shell: bash
        env:
          BUILD_CHANNEL: ${{ steps.version.outputs.channel }}
          ONEXTBOX_RELEASE_KEYSTORE_B64: ${{ secrets.ONEXTBOX_RELEASE_KEYSTORE_B64 }}
          ONEXTBOX_RELEASE_STORE_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_STORE_PASSWORD }}
          ONEXTBOX_RELEASE_KEY_ALIAS: ${{ secrets.ONEXTBOX_RELEASE_KEY_ALIAS }}
          ONEXTBOX_RELEASE_KEY_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          HAS_RELEASE_SIGNING=false
          KEYSTORE_PATH=""

          if [[ -n "${ONEXTBOX_RELEASE_KEYSTORE_B64}" && -n "${ONEXTBOX_RELEASE_STORE_PASSWORD}" && -n "${ONEXTBOX_RELEASE_KEY_ALIAS}" && -n "${ONEXTBOX_RELEASE_KEY_PASSWORD}" ]]; then
            mkdir -p .ci-signing
            KEYSTORE_PATH="${GITHUB_WORKSPACE}/.ci-signing/release.jks"
            umask 077
            printf '%s' "${ONEXTBOX_RELEASE_KEYSTORE_B64}" | base64 -d > "${KEYSTORE_PATH}"
            if ! keytool -list -keystore "${KEYSTORE_PATH}" -storepass:env ONEXTBOX_RELEASE_STORE_PASSWORD -alias "${ONEXTBOX_RELEASE_KEY_ALIAS}" >/dev/null 2>&1; then
              echo "::error::Signing keystore, store password or key alias is invalid. No certificate will be replaced."
              exit 1
            fi
            HAS_RELEASE_SIGNING=true
            echo "Release signing keystore prepared"
          else
            if [[ "${BUILD_CHANNEL}" == "ci" ]]; then
              echo "::warning::Release signing secrets are incomplete. CI will use debug signing for this test build."
            else
              echo "::error::Release signing secrets are incomplete. Release builds must use one unified signing certificate."
              exit 1
            fi
          fi

          echo "has_release_signing=${HAS_RELEASE_SIGNING}" >> "${GITHUB_OUTPUT}"
          echo "keystore_path=${KEYSTORE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Build APK
        shell: bash
        env:
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_STORE_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_KEY_ALIAS: ${{ secrets.ONEXTBOX_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_KEY_PASSWORD: ${{ secrets.ONEXTBOX_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ONEXTBOX_RELEASE_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.build_variant }}" = "both" ]; then
            TASKS=(":app:assembleDebug" ":app:assembleRelease")
          elif [ "${{ steps.version.outputs.build_variant }}" = "debug" ]; then
            TASKS=(":app:assembleDebug")
          else
            TASKS=(":app:assembleRelease")
          fi

          if [ "${{ steps.signing.outputs.has_release_signing }}" != "true" ] && [ "${{ steps.version.outputs.channel }}" != "ci" ]; then
            echo "::error::Release signing is required for release channel."
            exit 1
          fi

          SIGN_RELEASE_WITH_DEBUG=false
          if [ "${{ steps.signing.outputs.has_release_signing }}" != "true" ]; then
            SIGN_RELEASE_WITH_DEBUG=true
          fi

          GRADLE_ARGS=(
            "-PONEXTBOX_VERSION_NAME=${{ steps.version.outputs.version_name }}"
            "-PONEXTBOX_CI_SIGN_RELEASE_WITH_DEBUG=${SIGN_RELEASE_WITH_DEBUG}"
          )

          ./gradlew "${TASKS[@]}" "${GRADLE_ARGS[@]}" --no-daemon

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${GITHUB_WORKSPACE}/.ci-signing/release.jks"

      - name: Prepare APK files
        id: apks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE_LABEL="${{ steps.version.outputs.version_code_label }}"
          SAFE_VERSION_NAME="$(echo "${VERSION_NAME}" | sed 's/[^A-Za-z0-9._()-]/_/g')"

          if [[ "${{ steps.version.outputs.build_variant }}" == "both" ]]; then
            DEBUG_APK="$(ls -1 app/build/outputs/apk/debug/*.apk | head -n 1)"
            RELEASE_APK="$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)"
            DEBUG_OUT="dist/onextbox-${SAFE_VERSION_NAME}-${VERSION_CODE_LABEL}-debug.apk"
            RELEASE_OUT="dist/onextbox-${SAFE_VERSION_NAME}-${VERSION_CODE_LABEL}-release.apk"
            cp "${DEBUG_APK}" "${DEBUG_OUT}"
            cp "${RELEASE_APK}" "${RELEASE_OUT}"
            {
              echo "files<<EOF"
              echo "${DEBUG_OUT}"
              echo "${RELEASE_OUT}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${{ steps.version.outputs.build_variant }}" == "debug" ]]; then
            DEBUG_APK="$(ls -1 app/build/outputs/apk/debug/*.apk | head -n 1)"
            DEBUG_OUT="dist/onextbox-${SAFE_VERSION_NAME}-${VERSION_CODE_LABEL}-debug.apk"
            cp "${DEBUG_APK}" "${DEBUG_OUT}"
            echo "files=${DEBUG_OUT}" >> "${GITHUB_OUTPUT}"
          else
            RELEASE_APK="$(ls -1 app/build/outputs/apk/release/*.apk | head -n 1)"
            RELEASE_OUT="dist/onextbox-${SAFE_VERSION_NAME}-${VERSION_CODE_LABEL}-release.apk"
            cp "${RELEASE_APK}" "${RELEASE_OUT}"
            echo "files=${RELEASE_OUT}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify APK signatures and checksums
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER="$(find "${SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "${APKSIGNER}"
          for apk in dist/*.apk; do
            "${APKSIGNER}" verify "${apk}"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: onextbox-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code_label }}
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
