name: Sync source

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: public-source-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MiToverG422/ONextBox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: destination

      - name: Test publication safeguards
        run: python3 -m unittest discover -s destination/.github/tests -v

      - name: Check out source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          ref: main
          path: source
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          persist-credentials: true
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Publish latest eligible snapshot directly to main
        run: bash destination/.github/scripts/publish_source.sh source destination
